# Standalone public demo. Database is a durable file, execution is embedded.
# The separate distributed fleet remains in docker-compose.yml.
services:
  explorer:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/explorer.db
      PUBLIC_DEMO: "1"
      ENABLE_DEMO_MCP: "0"
    volumes:
      - explorer_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  explorer_data:
